about_content: | # this will include new lines to allow paragraphs
  Hi, my name is Ji-Woo Song, and I am a graduate student in Artificial Intelligence at Konkuk University. I am currently conducting research at the NLP Lab, focusing on <mark>Natural Language Processing (NLP)</mark> and <mark>Large Language Models (LLMs)</mark>.

  My research interests include mitigating hallucinations in LLMs and improving retrieval-augmented generation (RAG) search performance. I have experience working with machine learning, deep learning, and software optimization techniques.

  Previously, I conducted research on feature selection using genetic algorithms and machine learning for healthcare applications.

  I am proficient in Python, PyTorch, and Scikit-learn, and I have hands-on experience with software development, web applications, and data engineering.

