        title: "K-NLPers at BEA 2025 Shared Task: Evaluating the Quality of AI Tutor Responses with GPT-4.1"
        link: https://aclanthology.org/2025.bea-1.90/
        quote: >
          This paper presents automatic evaluation systems for assessing the pedagogical capabilities of LLM-based AI tutors.(*co-first author)
        # link_text: Project Website
        additional_links:
          - title:  "K-NLPers at BEA 2025 Shared Task: Evaluating the Quality of AI Tutor Responses with GPT-4.1"
            icon: far fa-book-open
            url: https://aclanthology.org/2025.bea-1.90/
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        description: | # this will include new lines to allow paragraphs
          Introduced automatic evaluation systems leveraging GPT-4.1 to assess AI tutor responses across four pedagogical dimensions: Mistake Identification, Mistake Location, Providing Guidance, and Actionability. Achieved macro F1 scores of 58.80% (Mistake Location, ranked top-3) and 56.06% (Providing Guidance, ranked top-5), demonstrating effectiveness in evaluating educational response quality.

      - layout: top-middle
        title: An Embedding-Based Dynamic Few-Shot PromptingStrategy for Solving Multimodal Math Problems
        link: https://www.dbpia.co.kr/journal/articleDetail?nodeId=NODE12318246
        # link_text: Project Website
